syntax = "proto3";

package agent.v1;

option go_package = "github.com/dunkeltech/botbox/backend/internal/gen/proto/agent/v1;agentv1";

// AgentService runs inside each sandbox container to handle health checks,
// host-driven computer-use actions, command execution, and /home/bot file access.
service AgentService {
  // RunCLI executes one bounded CLI turn and streams both output pipes.
  rpc RunCLI(RunCLIRequest) returns (stream RunCLIResponse);

  // Ping verifies gRPC reachability and reports the sandbox hostname.
  rpc Ping(PingRequest) returns (PingResponse);

  // GetInfo returns runtime capabilities and uptime of the sandbox agent.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);

  // Screenshot captures the current :0 X11 framebuffer as a PNG image.
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);

  // Click moves the cursor to (x, y) on the 1280x800 desktop and clicks button.
  rpc Click(ClickRequest) returns (ClickResponse);

  // Type enters text on the active X11 window via xdotool.
  rpc Type(TypeRequest) returns (TypeResponse);

  // Key presses a key or key chord (for example "Return" or "ctrl+l") via xdotool.
  rpc Key(KeyRequest) returns (KeyResponse);

  // Exec executes a bounded command inside the sandbox under /home/bot.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // ListFiles lists entries inside a directory scoped strictly under /home/bot.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // ReadFile reads file bytes strictly under /home/bot.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile writes file bytes strictly under /home/bot.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // DesktopAction runs one computer-use or browser action on the shared desktop.
  rpc DesktopAction(DesktopActionRequest) returns (DesktopActionResponse);

  // SetControlLock cancels in-flight bot input when a human takes the desktop.
  rpc SetControlLock(SetControlLockRequest) returns (SetControlLockResponse);

  // PullDesktopActions returns actions the API has not stored yet.
  rpc PullDesktopActions(PullDesktopActionsRequest) returns (PullDesktopActionsResponse);

  // AckDesktopActions drops stored actions so the sandbox journal can shrink.
  rpc AckDesktopActions(AckDesktopActionsRequest) returns (AckDesktopActionsResponse);
}

message PingRequest {
  string caller = 1;
}

message PingResponse {
  string status = 1;
  string hostname = 2;
}

message GetInfoRequest {}

message GetInfoResponse {
  int32 display_width = 1;
  int32 display_height = 2;
  int64 uptime_seconds = 3;
  string version = 4;
  string home_dir = 5;
}

message ScreenshotRequest {}

message ScreenshotResponse {
  bytes image_png = 1;
  int32 width = 2;
  int32 height = 3;
}

message ClickRequest {
  int32 x = 1;
  int32 y = 2;
  string button = 3;
}

message ClickResponse {}

message TypeRequest {
  string text = 1;
}

message TypeResponse {}

message KeyRequest {
  string key = 1;
}

message KeyResponse {}

message ExecRequest {
  string command = 1;
  repeated string args = 2;
  string workdir = 3;
  int64 timeout_ms = 4;
}

message ExecResponse {
  string stdout = 1;
  string stderr = 2;
  int32 exit_code = 3;
}

message FileEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  int64 size_bytes = 4;
  int64 updated_at = 5;
}

message ListFilesRequest {
  string path = 1;
}

message ListFilesResponse {
  string path = 1;
  repeated FileEntry entries = 2;
}

message ReadFileRequest {
  string path = 1;
}

message ReadFileResponse {
  string path = 1;
  bytes content = 2;
  int64 size_bytes = 3;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
}

message WriteFileResponse {
  string path = 1;
  int64 size_bytes = 2;
}

message RunCLIRequest {
 string cli = 1;
 string prompt = 2;
 string session_id = 3;
 string model = 4;
 bool claude_subscription = 5;
}
message RunCLIResponse {
 bytes data = 1;
 bool stderr = 2;
 bool exited = 3;
 int32 exit_code = 4;
}

message DesktopActionRequest {
  string kind = 1;
  string payload_json = 2;
}

message DesktopActionResponse {
  string result_text = 1;
  bytes image = 2;
  string mime_type = 3;
  int32 width = 4;
  int32 height = 5;
  string error_code = 6;
}

message SetControlLockRequest {
  bool human = 1;
}

message SetControlLockResponse {}

message PullDesktopActionsRequest {}

message DesktopActionRecord {
  uint64 seq = 1;
  string session_id = 2;
  string kind = 3;
  string params_json = 4;
  string result_text = 5;
  string error_code = 6;
  bytes image = 7;
  string mime_type = 8;
  int32 coord_x = 9;
  int32 coord_y = 10;
  bool has_coord = 11;
  int64 unix_nano = 12;
}

message PullDesktopActionsResponse {
  string session_id = 1;
  repeated DesktopActionRecord records = 2;
}

message AckDesktopActionsRequest {
  string session_id = 1;
  uint64 through_seq = 2;
}

message AckDesktopActionsResponse {}
