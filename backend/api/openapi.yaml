openapi: 3.0.3
info:
  title: bot.Box Control Plane API
  version: 0.1.0
  description: REST API for first-run setup, authentication, workspaces, RBAC, invitations, and bot configuration.
paths:
  /api/healthz:
    get:
      operationId: getHealthz
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup required when database has zero users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '404':
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/setup/complete:
    post:
      operationId: completeSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
      responses:
        '201':
          description: Initial owner and workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Invalid setup secret or missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/refresh:
    post:
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session refreshed and token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Missing, invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Logged out
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Authenticated user and workspace memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces accessible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}:
    get:
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/members:
    get:
      operationId: listWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/members/{userID}:
    patch:
      operationId: updateWorkspaceMemberRole
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '400':
          description: Validation error or last owner protection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: removeWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: Member removed
        '400':
          description: Cannot remove last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/invitations:
    get:
      operationId: listInvitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Pending workspace invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/invitations/{invitationID}:
    delete:
      operationId: revokeInvitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/InvitationID'
      responses:
        '204':
          description: Invitation revoked
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/invitations/{token}:
    get:
      operationId: previewInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Valid invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          description: Unknown, expired, or already accepted invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Invitation accepted and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header or invited email mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown, expired, or already accepted invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Account already exists or user already in workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots:
    get:
      operationId: listBots
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace bots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: Bot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}:
    get:
      operationId: getBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Bot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotRequest'
      responses:
        '200':
          description: Updated bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '204':
          description: Bot deleted
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment:
    get:
      operationId: getBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Current sandbox environment state and resource telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment/start:
    post:
      operationId: startBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Sandbox started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment/stop:
    post:
      operationId: stopBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Sandbox stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment/restart:
    post:
      operationId: restartBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Sandbox restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/control/take:
    post:
      operationId: takeBotControl
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Desktop control claimed by caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Control lock held by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/control/release:
    post:
      operationId: releaseBotControl
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseControlRequest'
      responses:
        '200':
          description: Desktop control returned to bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Another user holds the control lock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/vnc-ticket:
    post:
      operationId: createVncTicket
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Short-lived HMAC-signed WebSocket ticket for desktop viewing/control
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTicketResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/terminal/exec:
    post:
      operationId: execBotTerminal
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalExecRequest'
      responses:
        '200':
          description: Command result from /home/bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalExecResponse'
        '400':
          description: Validation error or path escape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/files:
    get:
      operationId: listBotFiles
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
        - name: path
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Directory entries under /home/bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '400':
          description: Invalid or escaped path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace, bot, or directory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/files/content:
    get:
      operationId: readBotFile
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content under /home/bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContentResponse'
        '400':
          description: Invalid or escaped path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace, bot, or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: writeBotFile
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteFileContentRequest'
      responses:
        '200':
          description: File saved under /home/bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContentResponse'
        '400':
          description: Invalid or escaped path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    BotID:
      name: botID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    WorkspaceRole:
      type: string
      enum: [owner, admin, member, viewer]

    DriverType:
      type: string
      enum: [docker, kubernetes]

    LlmMode:
      type: string
      enum: [cli, api]

    BotStatus:
      type: string
      enum: [idle, thinking, action, stopped]

    AvatarMood:
      type: string
      enum: [idle, thinking, action, offline]

    SetupStatusResponse:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean

    SetupCompleteRequest:
      type: object
      required:
        - setupSecret
        - displayName
        - email
        - password
        - workspaceName
        - workspaceSlug
      properties:
        setupSecret:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        workspaceName:
          type: string
        workspaceSlug:
          type: string
        defaultDriver:
          $ref: '#/components/schemas/DriverType'
        defaultLocale:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string

    User:
      type: object
      required: [id, email, displayName, locale, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        locale:
          type: string
        createdAt:
          type: string
          format: date-time

    WorkspaceSummary:
      type: object
      required: [id, name, slug, defaultDriver, defaultLocale, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        defaultDriver:
          $ref: '#/components/schemas/DriverType'
        defaultLocale:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        createdAt:
          type: string
          format: date-time

    WorkspaceListResponse:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'

    CreateWorkspaceRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        defaultDriver:
          $ref: '#/components/schemas/DriverType'
        defaultLocale:
          type: string

    AuthSessionResponse:
      type: object
      required: [user, workspaces, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
        activeWorkspace:
          $ref: '#/components/schemas/WorkspaceSummary'
        accessToken:
          type: string

    MeResponse:
      type: object
      required: [user, workspaces]
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'

    WorkspaceMember:
      type: object
      required: [workspaceId, userId, email, displayName, locale, role, joinedAt]
      properties:
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        locale:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        joinedAt:
          type: string
          format: date-time

    WorkspaceMemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'

    InvitationSummary:
      type: object
      required: [id, workspaceId, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    InvitationListResponse:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationSummary'

    CreateInvitationRequest:
      type: object
      required: [role]
      properties:
        email:
          type: string
          format: email
          nullable: true
        role:
          $ref: '#/components/schemas/WorkspaceRole'

    CreatedInvitationResponse:
      type: object
      required: [invitation, token, inviteUrl]
      properties:
        invitation:
          $ref: '#/components/schemas/InvitationSummary'
        token:
          type: string
        inviteUrl:
          type: string

    InvitationPreviewResponse:
      type: object
      required: [id, workspaceId, workspaceName, workspaceSlug, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspaceSlug:
          type: string
        email:
          type: string
          format: email
          nullable: true
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        expiresAt:
          type: string
          format: date-time

    AcceptInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        password:
          type: string

    Bot:
      type: object
      required:
        - id
        - workspaceId
        - name
        - description
        - avatarSeed
        - llmMode
        - llmProvider
        - llmModel
        - driverType
        - replyLanguage
        - status
        - mood
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
        avatarSeed:
          type: string
        llmMode:
          $ref: '#/components/schemas/LlmMode'
        llmProvider:
          type: string
        llmModel:
          type: string
        driverType:
          $ref: '#/components/schemas/DriverType'
        replyLanguage:
          type: string
        status:
          $ref: '#/components/schemas/BotStatus'
        mood:
          $ref: '#/components/schemas/AvatarMood'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BotListResponse:
      type: object
      required: [bots]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'

    CreateBotRequest:
      type: object
      required:
        - name
        - avatarSeed
        - llmMode
        - llmProvider
        - llmModel
      properties:
        name:
          type: string
        description:
          type: string
        avatarSeed:
          type: string
        llmMode:
          $ref: '#/components/schemas/LlmMode'
        llmProvider:
          type: string
        llmModel:
          type: string
        driverType:
          $ref: '#/components/schemas/DriverType'
        replyLanguage:
          type: string

    UpdateBotRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        avatarSeed:
          type: string
        llmMode:
          $ref: '#/components/schemas/LlmMode'
        llmProvider:
          type: string
        llmModel:
          type: string
        driverType:
          $ref: '#/components/schemas/DriverType'
        replyLanguage:
          type: string

    EnvironmentStatus:
      type: string
      enum: [creating, running, stopped, error]

    EnvironmentStats:
      type: object
      required: [cpuPercent, memoryUsedMiB, memoryLimitMiB, volumeUsedMiB, volumeLimitMiB]
      properties:
        cpuPercent:
          type: number
          format: double
        memoryUsedMiB:
          type: integer
        memoryLimitMiB:
          type: integer
        volumeUsedMiB:
          type: integer
        volumeLimitMiB:
          type: integer

    ControlHolder:
      type: object
      required: [userId, displayName, email]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email

    WatcherUser:
      type: object
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string

    EnvironmentStateResponse:
      type: object
      required:
        - botId
        - workspaceId
        - driver
        - envId
        - status
        - image
        - cpuMillis
        - memoryMiB
        - volumeRef
        - controlNote
        - stats
        - watchers
        - updatedAt
      properties:
        botId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        driver:
          type: string
        envId:
          type: string
        status:
          $ref: '#/components/schemas/EnvironmentStatus'
        image:
          type: string
        cpuMillis:
          type: integer
        memoryMiB:
          type: integer
        volumeRef:
          type: string
        controlHolder:
          allOf:
            - $ref: '#/components/schemas/ControlHolder'
          nullable: true
          x-omitempty: false
        controlNote:
          type: string
        stats:
          $ref: '#/components/schemas/EnvironmentStats'
        watchers:
          type: array
          items:
            $ref: '#/components/schemas/WatcherUser'
        startedAt:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
        updatedAt:
          type: string
          format: date-time

    ReleaseControlRequest:
      type: object
      properties:
        note:
          type: string

    StreamTicketResponse:
      type: object
      required: [ticket, wsPath, canControl, expiresAt]
      properties:
        ticket:
          type: string
        wsPath:
          type: string
        canControl:
          type: boolean
        expiresAt:
          type: string
          format: date-time

    TerminalExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
        workdir:
          type: string

    TerminalExecResponse:
      type: object
      required: [stdout, stderr, exitCode, cwd]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
        cwd:
          type: string

    FileEntry:
      type: object
      required: [name, path, isDir, sizeBytes, updatedAt]
      properties:
        name:
          type: string
        path:
          type: string
        isDir:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time

    FileListResponse:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'

    FileContentResponse:
      type: object
      required: [path, content, sizeBytes]
      properties:
        path:
          type: string
        content:
          type: string
        sizeBytes:
          type: integer
          format: int64

    WriteFileContentRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
