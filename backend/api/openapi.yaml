components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    BotID:
      name: botID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SecretID:
      name: secretID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    BotRuntime:
      type: object
      required: [paused]
      properties:
        paused: {type: boolean}
    BudgetSummary:
      type: object
      required: [spendTodayMicros, budgets]
      properties:
        spendTodayMicros: {type: integer, format: int64}
        budgets: {type: array, items: {$ref: '#/components/schemas/BudgetState'}}
    BudgetState:
      type: object
      required: [id, period, limitMicros, spentMicros, warning, exceeded]
      properties:
        id: {type: string, format: uuid}
        botId: {type: string, format: uuid}
        period: {type: string, enum: [day, month]}
        limitMicros: {type: integer, format: int64}
        spentMicros: {type: integer, format: int64}
        warning: {type: boolean}
        exceeded: {type: boolean}
    SetBudgetRequest:
      type: object
      required: [period, limitMicros]
      properties:
        botId: {type: string, format: uuid}
        period: {type: string, enum: [day, month]}
        limitMicros: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
    ModelPriceRequest:
      type: object
      required: [provider, model, inputMicrosPerMillion, outputMicrosPerMillion, cacheMicrosPerMillion]
      properties:
        provider: {type: string, maxLength: 50}
        model: {type: string, maxLength: 100}
        inputMicrosPerMillion: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        outputMicrosPerMillion: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        cacheMicrosPerMillion: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
    ChatConversation:
      type: object
      required: [id, botId]
      properties:
        id: {type: string, format: uuid}
        botId: {type: string, format: uuid}
    ChatMessage:
      type: object
      required: [id, position, senderType, kind, content, createdAt]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, format: int64}
        senderType: {type: string, enum: [user, bot, system]}
        kind: {type: string, enum: [text, tool, system, card]}
        content: {type: string}
        createdAt: {type: string, format: date-time}
    ChatTurn:
      type: object
      required: [id, status, queueAhead, errorCode]
      properties:
