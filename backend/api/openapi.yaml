openapi: 3.0.3
info:
  title: bot.Box Control Plane API
  version: 0.1.0
  description: REST API for first-run setup, authentication, workspaces, RBAC, invitations, and bot configuration.
paths:
  /api/workspaces/{workspaceID}/bots/{botID}/runtime:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBotRuntime
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Persisted bot pause state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotRuntime'}
        '401': {description: Authentication required}
        '404': {description: Bot or workspace not found}
    put:
      operationId: setBotRuntime
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                paused: {type: boolean}
      responses:
        '200':
          description: Bot pause state saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotRuntime'}
        '400': {description: Missing or invalid pause state}
        '401': {description: Authentication required}
        '403': {description: Bot manager required}
        '404': {description: Bot or workspace not found}
        '503': {description: Runner control unavailable}
  /api/workspaces/{workspaceID}/budgets:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBudgetSummary
      security: [{bearerAuth: []}]
      parameters:
        - {name: botId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Usage and applicable budgets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetSummary'}
        '401': {description: Authentication required}
        '404': {description: Workspace or bot not found}
    put:
      operationId: setBudget
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetBudgetRequest'}
      responses:
        '200': {description: Budget saved and pending raise approved}
        '400': {description: Invalid budget}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
        '404': {description: Workspace or bot not found}
  /api/workspaces/{workspaceID}/model-prices:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setModelPrice
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelPriceRequest'}
      responses:
        '200': {description: Model price saved}
        '400': {description: Invalid price}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
  /api/workspaces/{workspaceID}/bots/{botID}/dm:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: openDirectMessage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Private direct message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatConversation'}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot chat}
        '404': {description: Bot or workspace not found}
  /api/workspaces/{workspaceID}/conversations:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listDirectMessages
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Only the caller's conversations
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ChatConversation'}}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
  /api/workspaces/{workspaceID}/conversations/{conversationID}/messages:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: conversationID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listChatMessages
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Paginated private history and current turn state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatHistory'}
        '401': {description: Authentication required}
        '404': {description: Private conversation not found}
    post:
      operationId: sendChatMessage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendChatMessageRequest'}
      responses:
        '202':
          description: Persisted and queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '400': {description: Invalid message}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot send messages}
        '404': {description: Private conversation not found}
        '409': {description: Request ID reused with different content}
        '429': {description: Message rate limit or bot queue capacity exceeded}
        '503': {description: Queue unavailable}
  /api/healthz:
    get:
      operationId: getHealthz
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup required when database has zero users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '404':
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/setup/complete:
    post:
      operationId: completeSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
      responses:
        '201':
          description: Initial owner and workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Invalid setup secret or missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/refresh:
    post:
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session refreshed and token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Missing, invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Logged out
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Authenticated user and workspace memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces accessible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}:
    get:
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Only the owner may change workspace settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/members:
    get:
      operationId: listWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/members/{userID}:
    patch:
      operationId: updateWorkspaceMemberRole
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '400':
          description: Validation error or last owner protection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: removeWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: Member removed
        '400':
          description: Cannot remove last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/invitations:
    get:
      operationId: listInvitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Pending workspace invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/invitations/{invitationID}:
    delete:
      operationId: revokeInvitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/InvitationID'
      responses:
        '204':
          description: Invitation revoked
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/invitations/{token}:
    get:
      operationId: previewInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Valid invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          description: Unknown, expired, or already accepted invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Invitation accepted and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing CSRF header or invited email mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown, expired, or already accepted invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Account already exists or user already in workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots:
    get:
      operationId: listBots
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace bots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: Bot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace not found or not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}:
    get:
      operationId: getBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Bot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotRequest'
      responses:
        '200':
          description: Updated bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteBot
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '204':
          description: Bot deleted
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment:
    get:
      operationId: getBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Current sandbox environment state and resource telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment/start:
    post:
      operationId: startBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Sandbox started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Workspace or bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/workspaces/{workspaceID}/bots/{botID}/environment/stop:
    post:
      operationId: stopBotEnvironment
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/BotID'
      responses:
        '200':
          description: Sandbox stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStateResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
