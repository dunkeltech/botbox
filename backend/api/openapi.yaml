      - name: serverID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: syncMCPServerTools
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Tool catalog refreshed from upstream MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServer'
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Owner or admin required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or server not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '502': {description: Upstream MCP server sync failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

  /api/workspaces/{workspaceID}/bots/{botID}/mcp:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/BotID'
    get:
      operationId: getBotMCPConfig
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Per-bot MCP server assignments and command policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMCPConfigResponse'
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or bot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

  /api/workspaces/{workspaceID}/bots/{botID}/mcp/{serverID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/BotID'
      - name: serverID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateBotMCPServerPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotMCPServerPolicyRequest'
      responses:
        '200':
          description: Bot MCP server policy saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMCPServerPolicy'
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Bot manager required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace, bot, or MCP server not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Stale policy revision conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

  /api/workspaces/{workspaceID}/bots/{botID}/mcp/logs:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/BotID'
      - name: action
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MCPCallLogAction'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
    get:
      operationId: listBotMCPLogs
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Recent MCP proxy decision logs for the bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCallLogListResponse'
        '400': {description: Invalid query parameter, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or bot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

  /api/workspaces/{workspaceID}/bots/{botID}/memories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/BotID'
    get:
      operationId: listBotMemories
      security: [{bearerAuth: []}]
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: mode
          in: query
          required: false
          schema: {$ref: '#/components/schemas/BotMemoryMode'}
        - name: source
          in: query
          required: false
          schema: {$ref: '#/components/schemas/BotMemorySourceKind'}
        - name: tag
          in: query
          required: false
          schema: {type: string, maxLength: 32}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Bot knowledge base entries and policy summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMemoryListResponse'
        '400': {description: Invalid query parameter, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or bot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    post:
      operationId: createBotMemory
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotMemoryRequest'
      responses:
        '201':
          description: Memory entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMemory'
        '400': {description: Validation error or secret detected, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Bot manager required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or bot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Always-in-context budget or entry limit exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    delete:
      operationId: clearBotMemories
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Knowledge base cleared}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Bot manager required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or bot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

  /api/workspaces/{workspaceID}/bots/{botID}/memories/policy:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/BotID'
    put:
      operationId: updateBotMemoryPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotMemoryPolicyRequest'
      responses:
        '200':
          description: Bot memory policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMemorySummary'
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Bot manager required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace or bot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

  /api/workspaces/{workspaceID}/bots/{botID}/memories/{memoryID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/BotID'
      - name: memoryID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateBotMemory
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotMemoryRequest'
      responses:
        '200':
          description: Memory entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMemory'
        '400': {description: Validation error or secret detected, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Bot manager required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace, bot, or memory entry not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Always-in-context budget exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    delete:
      operationId: deleteBotMemory
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Memory entry deleted}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Bot manager required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Workspace, bot, or memory entry not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    BotID:
      name: botID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SecretID:
      name: secretID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    BotGitLabInstances:
      type: object
      additionalProperties: false
      required: [origins]
      properties:
        origins:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: string, maxLength: 512}
    GitLabInstanceOrigin:
      type: object
      additionalProperties: false
      required: [origin]
      properties:
        origin: {type: string, maxLength: 512}
    GitLabInstance:
      type: object
      additionalProperties: false
      required: [name, origin]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        origin: {type: string, maxLength: 512}
    GitLabInstanceList:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items: {$ref: '#/components/schemas/GitLabInstance'}
    BotRuntime:
      type: object
      required: [paused]
      properties:
        paused: {type: boolean}
    SubscriptionBudgetPolicy:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    SubscriptionUsage:
      type: object
      required: [model, period, inputTokens, outputTokens, cacheTokens, internalChargeMicros, unknownRequests]
      properties:
        model: {type: string}
        period: {type: string, enum: [5h, day, week, month]}
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        cacheTokens: {type: integer, format: int64}
        internalChargeMicros: {type: integer, format: int64}
        unknownRequests: {type: integer, format: int64}
    CodexPlanStatus:
      type: object
      required: [status, ownedByYou]
      properties:
        status: {type: string, enum: [disconnected, connected, reconnect]}
        ownedByYou: {type: boolean}
    CodexPlanPairing:
      type: object
      required: [code]
      properties:
        code: {type: string}
    CodexPlanDisconnect:
      type: object
      required: [revocationConfirmed]
      properties:
        revocationConfirmed: {type: boolean}
    CompleteCodexPlanRequest:
      type: object
      required: [pairing, code, clientId, verifier, nonce, redirect]
      properties:
        pairing: {type: string, maxLength: 1024}
        code: {type: string, maxLength: 4096}
        clientId: {type: string, maxLength: 200}
        verifier: {type: string, maxLength: 128}
        nonce: {type: string, maxLength: 128}
        redirect: {type: string, maxLength: 100}
    BudgetSummary:
      type: object
      required: [spendTodayMicros, spendThisWeekMicros, totalSpendTodayMicros, totalSpendThisWeekMicros, budgets]
      properties:
        spendTodayMicros: {type: integer, format: int64}
        spendThisWeekMicros: {type: integer, format: int64}
        totalSpendTodayMicros: {type: integer, format: int64}
        totalSpendThisWeekMicros: {type: integer, format: int64}
        budgets: {type: array, items: {$ref: '#/components/schemas/BudgetState'}}
        countSubscriptionUsage: {type: boolean}
        subscriptionUsage: {type: array, items: {$ref: '#/components/schemas/SubscriptionUsage'}}
    BudgetState:
      type: object
      required: [id, period, limitMicros, spentMicros, warning, exceeded]
      properties:
        id: {type: string, format: uuid}
        botId: {type: string, format: uuid}
        period: {type: string, enum: [5h, day, week, month]}
        limitMicros: {type: integer, format: int64}
        spentMicros: {type: integer, format: int64}
        warning: {type: boolean}
        exceeded: {type: boolean}
    SetBudgetRequest:
      type: object
      required: [period, limitMicros]
      properties:
        botId: {type: string, format: uuid}
        period: {type: string, enum: [5h, day, week, month]}
        limitMicros: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
    ModelPriceRequest:
      type: object
      required: [provider, model, inputMicrosPerMillion, outputMicrosPerMillion, cacheMicrosPerMillion]
      properties:
        provider: {type: string, maxLength: 50}
        model: {type: string, maxLength: 100}
        inputMicrosPerMillion: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        outputMicrosPerMillion: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        cacheMicrosPerMillion: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
    ModelPrice:
      type: object
      required: [provider, model, inputMicrosPerMillion, outputMicrosPerMillion, cacheMicrosPerMillion]
      properties:
        provider: {type: string}
        model: {type: string}
        inputMicrosPerMillion: {type: integer, format: int64}
        outputMicrosPerMillion: {type: integer, format: int64}
        cacheMicrosPerMillion: {type: integer, format: int64}
    ModelPriceListResponse:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items: {$ref: '#/components/schemas/ModelPrice'}
    ChatConversation:
      type: object
      required: [id, botId]
      properties:
        id: {type: string, format: uuid}
        botId: {type: string, format: uuid}
    ToolCallPhase:
      type: string
      enum: [call, result]
    ToolCallMeta:
      type: object
      required: [phase, isError]
      properties:
        turnId: {type: string}
        toolCallId: {type: string}
        phase: {$ref: '#/components/schemas/ToolCallPhase'}
        isError: {type: boolean}
        errorCode: {type: string}
    ChatMessage:
      type: object
      required: [id, position, senderType, kind, content, createdAt]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, format: int64}
        senderType: {type: string, enum: [user, bot, system]}
        # A group transcript has several speakers. The ids are omitted for system rows.
        senderUserId: {type: string, format: uuid}
        senderBotId: {type: string, format: uuid}
        kind: {type: string, enum: [text, tool, system, card, approval, secret_request, progress, team_status, memory]}
        content: {type: string}
        secretRequest: {$ref: '#/components/schemas/SecretRequestSummary'}
        tool: {$ref: '#/components/schemas/ToolCallMeta'}
        inputRequest: {$ref: '#/components/schemas/GroupInputRequest'}
        progressBlocker: {type: boolean}
        teamStatus: {$ref: '#/components/schemas/TeamBotStatus'}
        memory: {$ref: '#/components/schemas/ChatMessageMemory'}
        createdAt: {type: string, format: date-time}
    TeamBotStatusState:
      type: string
      enum: [working, queued, waiting_approval, waiting_secret, completed, interrupted, failed, budget_exceeded, stopping, idle, unknown]
    TeamBotStatus:
      type: object
      required: [botId, name, state]
      properties:
        botId: {type: string, format: uuid}
        name: {type: string}
        state: {$ref: '#/components/schemas/TeamBotStatusState'}
        workingSince: {type: string, format: date-time}
        progress: {type: string}
        progressAt: {type: string, format: date-time}
    GroupInputRequest:
      type: object
      required: [state, deadline, required, recipients]
      properties:
        state: {type: string, enum: [waiting, collected, stopped]}
        deadline: {type: string, format: date-time}
        required: {type: boolean}
        recipients:
          type: array
          items: {$ref: '#/components/schemas/GroupInputRecipient'}
    GroupInputRecipient:
      type: object
      required: [botId, name, state]
      properties:
        botId: {type: string, format: uuid}
        name: {type: string}
        state: {type: string, enum: [waiting, replied, unavailable]}
    SecretRequestKind:
      type: string
      enum: [cli_egress, browser_login]
    SecretRequestStatus:
      type: string
      enum: [pending, fulfilling, fulfilled, denied, expired, cancelled, failed]
    SecretRequestScope:
      type: string
      enum: [ephemeral, bot_secret, workspace_secret]
    SecretRequestSummary:
      type: object
      required: [secretRequestId, kind, status, adapterId, targetOrigin, reason]
      properties:
        secretRequestId: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/SecretRequestKind'}
        status: {$ref: '#/components/schemas/SecretRequestStatus'}
        adapterId: {type: string}
        adapterLabel: {type: string}
        targetOrigin: {type: string}
        headerScheme: {type: string}
        envPlaceholderName: {type: string}
        placeholderValue: {type: string}
        reason: {type: string}
        grantedScope: {type: string}
        expiresAt: {type: string}
        errorCode: {type: string}
        brokerEnabled: {type: boolean}
        brokerSessionId: {type: string, format: uuid}
        takeoverActive: {type: boolean}
    FulfillSecretRequestBody:
      type: object
      required: [secretValue, scope]
      properties:
        secretValue: {type: string, minLength: 1, maxLength: 16384}
        username: {type: string, maxLength: 255}
        scope: {$ref: '#/components/schemas/SecretRequestScope'}
        replaceExisting: {type: boolean}
    SecretRequestResult:
      type: object
      required: [secretRequest]
      properties:
        secretRequest: {$ref: '#/components/schemas/SecretRequestSummary'}
        mfaRequired: {type: boolean}
    BrokerTakeoverState:
      type: object
      required: [secretRequest, brokerSessionId, origin, takeoverActive]
      properties:
        secretRequest: {$ref: '#/components/schemas/SecretRequestSummary'}
        brokerSessionId: {type: string, format: uuid}
        origin: {type: string}
        pageUrl: {type: string}
        takeoverActive: {type: boolean}
        captureSuppressed: {type: boolean}
        takeoverTicket: {type: string}
    BrokerTakeoverInputBody:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [click, type, key]}
        x: {type: number, format: double}
        y: {type: number, format: double}
        text: {type: string, maxLength: 1024}
        key: {type: string, maxLength: 64}
    Approval:
      type: object
      required: [id, botId, kind, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        botId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        budgetId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        kind: {type: string, enum: [new_host, raise_budget, push_protected, custom, mcp_tool]}
        status: {type: string, enum: [pending, approved, denied]}
        host: {type: string}
        branch: {type: string}
        label: {type: string}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, denied]}
    Notification:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [mention, approval, budget]}
        conversationId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        approvalId: {type: string, format: uuid}
        readAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        nextCursor: {type: string}
    ChatTurn:
      type: object
      required: [id, status, queueAhead, errorCode]
      properties:
        id: {type: string, format: uuid}
        botId: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, waiting_secret, completed, failed, interrupted, budget_exceeded]}
        stopRequested: {type: boolean, description: A stop request is pending for a running turn.}
        queueAhead: {type: integer, format: int64}
        errorCode: {type: string}
    ChatHistory:
      type: object
      required: [messages, turns]
      properties:
        messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
        turns: {type: array, items: {$ref: '#/components/schemas/ChatTurn'}}
    SendChatMessageRequest:
      type: object
      required: [id, content]
      properties:
        id: {type: string, format: uuid}
        content: {type: string, minLength: 1, maxLength: 8192}
    AskBeforeRule:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [new_host, raise_budget, push_protected, custom, mcp_tool]}
        label: {type: string, maxLength: 100}
    GroupMember:
      type: object
      required: [type, id, roleText]
      properties:
        type: {type: string, enum: [user, bot]}
        id: {type: string, format: uuid}
        roleText: {type: string, maxLength: 100}
        name: {type: string}
    Group:
      type: object
      required: [id, name, goal, leadBotId, botTalk, turnLimit, answerPolicy, askBefore, paused, pauseReason, turnsSinceHuman, unread, members]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        goal: {type: string}
        leadBotId: {type: string, format: uuid}
        botTalk: {type: boolean}
        turnLimit: {type: integer}
        answerPolicy: {type: string, enum: [mentioned_else_lead, lead_first, round_robin]}
        askBefore: {type: array, items: {$ref: '#/components/schemas/AskBeforeRule'}}
        budgetLimitMicros: {type: integer, format: int64, nullable: true}
        paused: {type: boolean}
        pauseReason: {type: string}
        turnsSinceHuman: {type: integer}
        unread: {type: integer, format: int64}
        members: {type: array, items: {$ref: '#/components/schemas/GroupMember'}}
    CreateGroupRequest:
      type: object
      required: [id, name, leadBotId, botTalk, turnLimit, answerPolicy, askBefore, members]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        goal: {type: string, maxLength: 8192}
        leadBotId: {type: string, format: uuid}
        botTalk: {type: boolean}
        turnLimit: {type: integer, minimum: 1, maximum: 100}
