openapi: 3.0.3
info:
  title: bot.Box Control Plane API
  version: 0.1.0
  description: REST API for first-run setup, authentication, workspaces, RBAC, invitations, and bot configuration.
paths:
  /api/workspaces/{workspaceID}/subscription-budget-policy:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setSubscriptionBudgetPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionBudgetPolicy'}
      responses:
        '204': {description: Policy updated}
        '400': {description: Invalid policy}
        '401': {description: Authentication required}
        '403': {description: Insufficient permissions}
        '404': {description: Workspace not found}
  /api/workspaces/{workspaceID}/bots/{botID}/codex-plan:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getCodexPlan
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Bot desktop ChatGPT connection status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexPlanStatus'}
        '401': {description: Authentication required}
        '403': {description: Insufficient permissions}
        '404': {description: Workspace or bot not found}
    delete:
      operationId: disconnectCodexPlan
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Connection removed locally
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexPlanDisconnect'}
        '401': {description: Authentication required}
        '403': {description: Insufficient permissions}
        '404': {description: Workspace or bot not found}
  /api/workspaces/{workspaceID}/bots/{botID}/codex-plan/pairing:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: startCodexPlanPairing
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: One-use workstation pairing code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexPlanPairing'}
        '401': {description: Authentication required}
        '403': {description: Insufficient permissions}
        '404': {description: Workspace or bot not found}
        '409': {description: A different user has a pending pairing}
        '429': {description: Pairing rate limit reached}
  /api/codex-plan/pairing/complete:
    post:
      operationId: completeCodexPlanPairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteCodexPlanRequest'}
      responses:
        '204': {description: Desktop ChatGPT connection authorized}
        '400': {description: Invalid pairing or OAuth proof}
        '403': {description: ChatGPT plan consent or bot permission is missing}
        '409': {description: Pairing expired or already used}
        '429': {description: Pairing rate limit reached}
        '503': {description: Connection service unavailable}
  /api/workspaces/{workspaceID}/bots/{botID}/gitlab-instances:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listBotGitLabInstances
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: GitLab instances assigned to this bot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabInstanceList'}
        '401': {description: Authentication required}
        '404': {description: Workspace or bot not found}
    put:
      operationId: setBotGitLabInstances
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BotGitLabInstances'}
      responses:
        '200':
          description: Assignments saved and removed access revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabInstanceList'}
        '400': {description: Invalid or unregistered origins}
        '401': {description: Authentication required}
        '403': {description: Bot manager required}
        '404': {description: Workspace or bot not found}
  /api/workspaces/{workspaceID}/gitlab-instances:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listGitLabInstances
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Approved GitLab browser, REST API and Git HTTPS instances
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabInstanceList'}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
    post:
      operationId: createGitLabInstance
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitLabInstance'}
      responses:
        '201':
          description: GitLab instance registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabInstance'}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
        '404': {description: Workspace not found}
        '409': {description: Duplicate instance or instance limit reached}
    delete:
      operationId: deleteGitLabInstance
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitLabInstanceOrigin'}
      responses:
        '204': {description: Instance removed and sessions revoked}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
        '404': {description: Workspace or instance not found}
  /api/workspaces/{workspaceID}/bots/{botID}/runtime:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBotRuntime
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Persisted bot pause state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotRuntime'}
        '401': {description: Authentication required}
        '404': {description: Bot or workspace not found}
    put:
      operationId: setBotRuntime
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                paused: {type: boolean}
      responses:
        '200':
          description: Bot pause state saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BotRuntime'}
        '400': {description: Missing or invalid pause state}
        '401': {description: Authentication required}
        '403': {description: Bot manager required}
        '404': {description: Bot or workspace not found}
        '503': {description: Runner control unavailable}
  /api/workspaces/{workspaceID}/budgets:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBudgetSummary
      security: [{bearerAuth: []}]
      parameters:
        - {name: botId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Usage and applicable budgets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetSummary'}
        '401': {description: Authentication required}
        '404': {description: Workspace or bot not found}
    put:
      operationId: setBudget
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetBudgetRequest'}
      responses:
        '200': {description: Budget saved and pending raise approved}
        '400': {description: Invalid budget}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
        '404': {description: Workspace or bot not found}
    delete:
      operationId: deleteBotBudget
      security: [{bearerAuth: []}]
      parameters:
        - {name: botId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: period, in: query, required: true, schema: {type: string, enum: [5h, day, week, month]}}
      responses:
        '204': {description: Bot budget cap removed}
        '400': {description: Invalid bot id or period}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
        '404': {description: Workspace or bot not found}
  /api/workspaces/{workspaceID}/model-prices:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listModelPrices
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Configured model pricing rates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelPriceListResponse'}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
    put:
      operationId: setModelPrice
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelPriceRequest'}
      responses:
        '200': {description: Model price saved}
        '400': {description: Invalid price}
        '401': {description: Authentication required}
        '403': {description: Owner or admin required}
  /api/workspaces/{workspaceID}/bots/{botID}/dm:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: openDirectMessage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Private direct message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatConversation'}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot chat}
        '404': {description: Bot or workspace not found}
  /api/workspaces/{workspaceID}/conversations:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listDirectMessages
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Only the caller's conversations
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ChatConversation'}}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
  /api/workspaces/{workspaceID}/conversations/{conversationID}/messages:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: conversationID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listChatMessages
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Paginated private history and current turn state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatHistory'}
        '401': {description: Authentication required}
        '404': {description: Private conversation not found}
    post:
      operationId: sendChatMessage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendChatMessageRequest'}
      responses:
        '202':
          description: Persisted and queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '400': {description: Invalid message}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot send messages}
        '404': {description: Private conversation not found}
        '409': {description: Request ID reused with different content}
        '429': {description: Message rate limit or bot queue capacity exceeded}
        '503': {description: Queue unavailable}
  /api/workspaces/{workspaceID}/conversations/{conversationID}/turns/{turnID}/stop:
    post:
      operationId: stopChatTurn
      security: [{bearerAuth: []}]
      parameters:
        - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: conversationID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: turnID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Stop requested for the running turn. Other states are a no-op.}
        '400': {description: Invalid identifier}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot stop turns}
        '404': {description: Private conversation or turn not found}
        '503': {description: Chat service unavailable}
  /api/workspaces/{workspaceID}/groups:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listGroups
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Groups the caller belongs to
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Group'}}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
    post:
      operationId: createGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '200':
          description: Same request id and body replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {description: Invalid group}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot create groups}
        '404': {description: Workspace not found}
        '409': {description: Request id reused with a different body}
  /api/workspaces/{workspaceID}/groups/{groupID}:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: groupID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getGroup
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Group visible to a member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '401': {description: Authentication required}
        '404': {description: Group not found}
    patch:
      operationId: updateGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGroupRequest'}
      responses:
        '200':
          description: Settings replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {description: Invalid settings}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot change a group}
        '404': {description: Group not found}
    delete:
      operationId: deleteGroup
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Group and chat history permanently deleted; usage retained}
        '400': {description: Invalid group identifier}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot delete a group}
        '404': {description: Group not found or caller is not a member}
        '409': {description: 'Group has running work, a secret wait, or active credentials'}
        '503': {description: Chat storage unavailable}
  /api/workspaces/{workspaceID}/groups/{groupID}/messages:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: groupID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listGroupMessages
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Group history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatHistory'}
        '401': {description: Authentication required}
        '404': {description: Group not found}
    post:
      operationId: sendGroupMessage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendChatMessageRequest'}
      responses:
        '202':
          description: Stored. Bots are not queued by this call.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '400': {description: Invalid message}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot post}
        '404': {description: Group not found}
        '409': {description: Request id reused with different content}
        '429': {description: Message rate limit exceeded}
  /api/workspaces/{workspaceID}/groups/{groupID}/turns/{turnID}/stop:
    post:
      operationId: stopGroupTurn
      security: [{bearerAuth: []}]
      parameters:
        - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: groupID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: turnID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Stop requested for the running turn. Other states are a no-op.}
        '400': {description: Invalid identifier}
        '401': {description: Authentication required}
        '403': {description: Viewers cannot stop turns}
        '404': {description: Group or turn not found}
        '503': {description: Chat service unavailable}
  /api/workspaces/{workspaceID}/groups/{groupID}/read:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: groupID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: markGroupRead
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Read cursor moved to the latest message}
        '401': {description: Authentication required}
        '404': {description: Group not found}
  /api/workspaces/{workspaceID}/approvals:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listApprovals
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, denied]}}
      responses:
        '200':
          description: Approvals visible to the caller. Workspace budget rows are included for owners and admins.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalList'}
        '400': {description: Invalid status filter}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
  /api/workspaces/{workspaceID}/approvals/{approvalID}/decision:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: approvalID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: decideApproval
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '204': {description: Decision stored. An approval pause queues the waiting bot.}
        '400': {description: Missing or invalid decision}
        '401': {description: Authentication required}
        '403': {description: Viewer cannot decide}
        '404': {description: Approval not visible to the caller}
        '409': {description: Already decided, host already allowed, or cap still exhausted}
        '429': {description: Bot queue is full}
        '503': {description: Turn queue is unavailable}
  /api/workspaces/{workspaceID}/secret-requests/{requestID}/fulfill:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: requestID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: fulfillSecretRequest
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FulfillSecretRequestBody'}
      responses:
        '200':
          description: Secret encrypted and stored outside the sandbox; turn queued for non-secret continuation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretRequestResult'}
        '400': {description: Invalid request input}
        '401': {description: Authentication required}
        '403': {description: Insufficient role for secret fulfillment or scope}
        '404': {description: Secret request not visible to caller}
        '409': {description: Request already decided, expired, host not allowlisted, or conflicting secret rule}
        '422': {description: Unsupported secret request capability (such as browser_login before isolated broker)}
        '503': {description: Turn queue or encryption dependency unavailable}
  /api/workspaces/{workspaceID}/secret-requests/{requestID}/deny:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: requestID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: denySecretRequest
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Secret request denied; turn queued for continuation without credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretRequestResult'}
        '400': {description: Invalid request identifier}
        '401': {description: Authentication required}
        '403': {description: Viewer cannot deny secret requests}
        '404': {description: Secret request not visible to caller}
        '409': {description: Request already decided or expired}
        '503': {description: Turn queue unavailable}
  /api/workspaces/{workspaceID}/secret-requests/{requestID}/broker-takeover/start:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: requestID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: startBrokerTakeover
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Human-only takeover started on isolated broker; bot access and captures disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrokerTakeoverState'}
        '401': {description: Authentication required}
        '403': {description: Insufficient role or takeover owned by another user}
        '404': {description: Secret request not visible to caller}
        '409': {description: Request not eligible for takeover}
        '422': {description: Broker capability disabled}
  /api/workspaces/{workspaceID}/secret-requests/{requestID}/broker-takeover/frame:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: requestID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: ticket, in: query, required: false, schema: {type: string}}
    get:
      operationId: getBrokerTakeoverFrame
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: PNG frame captured from the isolated broker viewport for the takeover owner only.
          content:
            image/png:
              schema: {type: string, format: binary}
        '401': {description: Authentication required}
        '403': {description: Takeover belongs to another user or viewer}
        '404': {description: Secret request not visible to caller}
        '409': {description: Takeover is not active}
        '422': {description: Broker capability disabled}
  /api/workspaces/{workspaceID}/secret-requests/{requestID}/broker-takeover/input:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: requestID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: sendBrokerTakeoverInput
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BrokerTakeoverInputBody'}
      responses:
        '200':
          description: Takeover UI event forwarded exclusively to isolated broker viewport.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrokerTakeoverState'}
        '400': {description: Invalid takeover input}
        '401': {description: Authentication required}
        '403': {description: Takeover belongs to another user or viewer}
        '404': {description: Secret request not visible to caller}
        '409': {description: Takeover is not active}
        '422': {description: Broker capability disabled}
  /api/workspaces/{workspaceID}/secret-requests/{requestID}/broker-takeover/complete:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: requestID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: completeBrokerTakeover
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Human takeover verified and completed; bot turn resumed with non-secret broker session reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretRequestResult'}
        '401': {description: Authentication required}
        '403': {description: Takeover belongs to another user or viewer}
        '404': {description: Secret request not visible to caller}
        '409': {description: Takeover not active or broker landed outside adapter-permitted origin}
        '422': {description: Broker capability disabled}
  /api/workspaces/{workspaceID}/notifications:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: The caller's notifications, newest first. Rows have no message text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationList'}
        '400': {description: Invalid cursor or limit}
        '401': {description: Authentication required}
        '404': {description: Workspace not found}
  /api/workspaces/{workspaceID}/notifications/read:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: markNotificationsRead
      security: [{bearerAuth: []}]
      responses:
        '204': {description: The caller's unread rows in this workspace are marked read}
        '401': {description: Authentication required}
        '403': {description: Missing CSRF header}
        '404': {description: Workspace not found}
  /api/workspaces/{workspaceID}/notifications/{notificationID}/read:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: notificationID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: markNotificationRead
      security: [{bearerAuth: []}]
      responses:
        '204': {description: The caller's row is marked read}
        '400': {description: Invalid notification id}
        '401': {description: Authentication required}
        '403': {description: Missing CSRF header}
        '404': {description: Notification is not the caller's row}
  /api/workspaces/{workspaceID}/conversations/{conversationID}/messages/{messageID}/tool-image:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: conversationID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: messageID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getChatToolImage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Screenshot referenced by a tool message in this private conversation
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
        '400': {description: Invalid message identifier}
        '401': {description: Authentication required}
        '404': {description: Conversation, message, or screenshot not found}
        '409': {description: Sandbox is not running}
        '502': {description: Sandbox could not be read}
