name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner

      - name: Enable devenv Cachix cache
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Install frontend dependencies
        run: devenv shell -- npm --prefix frontend ci

      - name: Run codegen, lint, tests, build, and sandbox image
        run: devenv shell -- make gen lint test build sandbox-image
