[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=bot

[program:xvnc]
command=/usr/bin/Xtigervnc %(ENV_DISPLAY)s -geometry %(ENV_VNC_RESOLUTION)s -depth 24 -rfbport %(ENV_VNC_PORT)s -localhost yes -SecurityTypes None -AlwaysShared
autorestart=true
priority=10
stdout_logfile=/tmp/xvnc.log
stderr_logfile=/tmp/xvnc.log

[program:xfce]
command=/bin/bash -c "for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X0 ] && break; sleep 0.1; done; exec dbus-launch startxfce4"
autorestart=true
priority=20
stdout_logfile=/tmp/xfce4.log
stderr_logfile=/tmp/xfce4.log

[program:websockify]
command=/usr/bin/websockify 0.0.0.0:%(ENV_WEBSOCKIFY_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s
autorestart=true
priority=30
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify.log

[program:agent]
command=/usr/local/bin/botbox-agent
autorestart=true
priority=40
stdout_logfile=/tmp/botbox-agent.log
stderr_logfile=/tmp/botbox-agent.log
